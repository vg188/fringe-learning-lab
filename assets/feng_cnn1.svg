<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 290" role="img" aria-labelledby="title desc"><title id="title">CNN1 背景估计</title><desc id="desc">原创教学流程：单张条纹经卷积特征、四个残差块与输出卷积得到估计背景。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#245747"/></marker></defs><style>text{font-family:Segoe UI,Microsoft YaHei,PingFang SC,sans-serif;fill:#213b30} .title{font-size:23px;font-weight:600}.label{font-size:17px}.small{font-size:14px;fill:#526b5e}.box{fill:#f3f8f5;stroke:#b7cdc0;stroke-width:1.5;rx:10}.flow{fill:none;stroke:#245747;stroke-width:2;marker-end:url(#arrow)}.skip{fill:none;stroke:#b7602b;stroke-width:2;stroke-dasharray:6 5;marker-end:url(#arrow)}</style><rect width="960" height="290" fill="white"/><text x="35" y="40" class="title">CNN1：先估计背景 A</text><rect x="30" y="100" width="145" height="95" class="box"/><text x="102.5" y="133" text-anchor="middle" class="label">原始条纹 I</text><text x="102.5" y="164" text-anchor="middle" class="small">H × W × 1</text><rect x="220" y="100" width="155" height="95" class="box"/><text x="297.5" y="133" text-anchor="middle" class="label">卷积特征</text><text x="297.5" y="164" text-anchor="middle" class="small">局部明暗与纹理</text><rect x="420" y="100" width="285" height="95" class="box"/><text x="562.5" y="133" text-anchor="middle" class="label">4 个残差块</text><text x="562.5" y="164" text-anchor="middle" class="small">每块学习 F(x)，与输入相加</text><rect x="750" y="100" width="180" height="95" class="box"/><text x="840" y="133" text-anchor="middle" class="label">输出背景 Â</text><text x="840" y="164" text-anchor="middle" class="small">后续卷积预测</text><path d="M175 148H210M375 148H410M705 148H740" class="flow"/><text x="35" y="235" class="small">功能层级示意，省略具体核尺寸与通道配置；不能用此图代替完整复现配置。</text><text x="35" y="267" class="small">教学重绘 · 参考 Feng et al. (2019), 图2及正文</text></svg>