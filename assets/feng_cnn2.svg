<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" role="img" aria-labelledby="title desc"><title id="title">CNN2 双尺度中间量预测</title><desc id="desc">原创教学示意：输入原条纹和预测背景，在原分辨率和半分辨率路径提取特征，再拼接并预测M和D。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#245747"/></marker></defs><style>text{font-family:Segoe UI,Microsoft YaHei,PingFang SC,sans-serif;fill:#213b30} .title{font-size:23px;font-weight:600}.label{font-size:17px}.small{font-size:14px;fill:#526b5e}.box{fill:#f3f8f5;stroke:#b7cdc0;stroke-width:1.5;rx:10}.flow{fill:none;stroke:#245747;stroke-width:2;marker-end:url(#arrow)}.skip{fill:none;stroke:#b7602b;stroke-width:2;stroke-dasharray:6 5;marker-end:url(#arrow)}</style><rect width="960" height="390" fill="white"/><text x="35" y="40" class="title">CNN2：两种尺度，一起预测 M 与 D</text><rect x="25" y="149" width="165" height="95" class="box"/><text x="107" y="181" text-anchor="middle" class="label">输入 I 与 Â</text><text x="107" y="212" text-anchor="middle" class="small">H × W × 2</text><rect x="275" y="90" width="245" height="75" class="box"/><text x="397" y="120" text-anchor="middle" class="label">原尺度特征路径</text><text x="397" y="148" text-anchor="middle" class="small">保留空间细节</text><rect x="245" y="245" width="305" height="75" class="box"/><text x="397" y="275" text-anchor="middle" class="label">下采样 → 特征 → 上采样</text><text x="397" y="303" text-anchor="middle" class="small">半尺度上下文，再恢复尺寸</text><rect x="615" y="158" width="115" height="80" class="box"/><text x="672" y="190" text-anchor="middle" class="label">拼接</text><text x="672" y="219" text-anchor="middle" class="small">通道融合</text><rect x="788" y="149" width="147" height="95" class="box"/><text x="861" y="181" text-anchor="middle" class="label">M̂ 与 D̂</text><text x="861" y="212" text-anchor="middle" class="small">线性输出层</text><path d="M190 182H222V126H265M190 212H213V282H235M520 126H579V180H605M550 282H579V217H605M730 198H778" class="flow"/><text x="35" y="357" class="small">教学重绘 · 参考 Feng et al. (2019), 图3及正文；双尺度结构并不等于原版 U-Net。</text></svg>