<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 570" role="img" aria-labelledby="title desc"><title id="title">U-Net 的多尺度信息融合</title><desc id="desc">原创教学示意：编码器逐级缩小特征，解码器逐级放大，四个相应尺度的特征通过裁剪拼接连接。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#245747"/></marker></defs><style>text{font-family:Segoe UI,Microsoft YaHei,PingFang SC,sans-serif;fill:#213b30} .title{font-size:23px;font-weight:600}.label{font-size:17px}.small{font-size:14px;fill:#526b5e}.box{fill:#f3f8f5;stroke:#b7cdc0;stroke-width:1.5;rx:10}.flow{fill:none;stroke:#245747;stroke-width:2;marker-end:url(#arrow)}.skip{fill:none;stroke:#b7602b;stroke-width:2;stroke-dasharray:6 5;marker-end:url(#arrow)}</style><rect width="960" height="570" fill="white"/><text x="35" y="40" class="title">U-Net：上下文走深，位置细节跨层传递</text><text x="163" y="76" text-anchor="middle" class="small">编码器：两次 valid 卷积后</text><text x="780" y="76" text-anchor="middle" class="small">解码器：融合后再卷积</text><rect x="50" y="98" width="228" height="55" class="box"/><text x="164" y="132" text-anchor="middle" class="label">568 × 568 × 64</text><rect x="664" y="98" width="245" height="55" class="box"/><text x="786" y="132" text-anchor="middle" class="label">388 × 388 × 64</text><path d="M285 125H653" class="skip"/><path d="M164 157V177M786 178V158" class="flow"/><rect x="50" y="185" width="228" height="55" class="box"/><text x="164" y="219" text-anchor="middle" class="label">280 × 280 × 128</text><rect x="664" y="185" width="245" height="55" class="box"/><text x="786" y="219" text-anchor="middle" class="label">196 × 196 × 128</text><path d="M285 212H653" class="skip"/><path d="M164 244V264M786 265V245" class="flow"/><rect x="50" y="272" width="228" height="55" class="box"/><text x="164" y="306" text-anchor="middle" class="label">136 × 136 × 256</text><rect x="664" y="272" width="245" height="55" class="box"/><text x="786" y="306" text-anchor="middle" class="label">100 × 100 × 256</text><path d="M285 299H653" class="skip"/><path d="M164 331V351M786 352V332" class="flow"/><rect x="50" y="359" width="228" height="55" class="box"/><text x="164" y="393" text-anchor="middle" class="label">64 × 64 × 512</text><rect x="664" y="359" width="245" height="55" class="box"/><text x="786" y="393" text-anchor="middle" class="label">52 × 52 × 512</text><path d="M285 386H653" class="skip"/><rect x="340" y="457" width="280" height="58" class="box"/><text x="480" y="493" text-anchor="middle" class="label">瓶颈：28 × 28 × 1024</text><path d="M164 419V486H330M620 486H786V419" class="flow"/><text x="470" y="93" text-anchor="middle" class="small">虚线：裁剪后拼接，不是逐元素相加</text><text x="35" y="547" class="small">教学重绘 · 原版输入572²，经1×1输出卷积得到388²类别分数；参考 Ronneberger et al. (2015), §2。</text></svg>