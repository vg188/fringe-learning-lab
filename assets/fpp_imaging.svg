<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="title desc"><title id="title">投影、反射与采集</title><desc id="desc">原创教学示意：投影条纹照射物体，相机从不同位置拍摄；额外环境光也影响强度。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#245747"/></marker></defs><style>text{font-family:Segoe UI,Microsoft YaHei,PingFang SC,sans-serif;fill:#213b30} .title{font-size:23px;font-weight:600}.label{font-size:17px}.small{font-size:14px;fill:#526b5e}.box{fill:#f3f8f5;stroke:#b7cdc0;stroke-width:1.5;rx:10}.flow{fill:none;stroke:#245747;stroke-width:2;marker-end:url(#arrow)}.skip{fill:none;stroke:#b7602b;stroke-width:2;stroke-dasharray:6 5;marker-end:url(#arrow)}</style><rect width="960" height="400" fill="white"/><text x="35" y="40" class="title">从已知条纹，到相机里的亮度</text><rect x="45" y="132" width="200" height="110" class="box"/><text x="145" y="165" text-anchor="middle" class="label">投影仪</text><text x="145" y="195" text-anchor="middle" class="small">已知图案与投影坐标</text><text x="145" y="221" text-anchor="middle" class="small">Iᵖ = a + b cos(φᵖ)</text><rect x="375" y="132" width="205" height="110" class="box"/><text x="477" y="165" text-anchor="middle" class="label">物体表面</text><text x="477" y="195" text-anchor="middle" class="small">几何形状 + 反射响应</text><text x="477" y="221" text-anchor="middle" class="small">改变所见条纹的相位</text><rect x="710" y="132" width="205" height="110" class="box"/><text x="812" y="165" text-anchor="middle" class="label">相机</text><text x="812" y="195" text-anchor="middle" class="small">按像素记录变形条纹</text><text x="812" y="221" text-anchor="middle" class="small">I = A + B cos φ</text><path d="M245 180H365" class="flow"/><path d="M580 180H700" class="flow"/><text x="303" y="165" text-anchor="middle" class="small">投射</text><text x="641" y="165" text-anchor="middle" class="small">反射</text><text x="645" y="83" text-anchor="middle" class="label">环境光</text><path d="M618 93L532 120M672 93L766 120" class="flow"/><path d="M810 252V300H150V252" class="flow"/><text x="477" y="330" text-anchor="middle" class="small">标定建立相机与投影仪的几何关系；相位本身还不是毫米高度</text><text x="35" y="375" class="small">教学重绘 · 非原论文插图 · 参考 Zuo et al. (2018), §2</text></svg>